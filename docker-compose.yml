version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: ieadalpe-postgres
    environment:
      POSTGRES_DB: ieadalpe_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ieadalpe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ieadalpe-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/ieadalpe_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 12345678901234567890123456789012
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: