spring:
  jpa:
    open_in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  application:
    name: ieadalpe-api
  profiles:
    active: dev


server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always