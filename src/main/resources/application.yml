spring:
  jpa:
    open_in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  application:
    name: ieadalpe-api
  profiles:
    active: dev


server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always]
    info:
      env:
        enabled: true

  info:
    app:
      name: IEADALPE API
      description: API de Gestão da Igreja
      version: 1.0.0